<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminador de Fondo</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; text-align: center; margin-top: 40px; }
    .dropzone { border: 2px dashed #444; border-radius: 8px; padding: 40px 20px; cursor: pointer; background: #1e1e1e; }
    .dropzone:hover { border-color: #888; }
    input[type="file"] { display: none; }
    #status { margin: 20px 0; font-size: 14px; color: #aaa; }
    .result { display: none; margin-top: 20px; }
    canvas { max-width: 100%; border-radius: 8px; background: repeating-conic-gradient(#808080 0% 25%, #fff 0% 50%) 50% / 16px 16px; }
    .btn { display: inline-block; background: #0066cc; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
    .btn:hover { background: #0052a3; }
  </style>
</head>
<body>

  <div class="container">
    <div class="dropzone" id="dropzone">
      <span id="label">Haz clic o arrastra tu imagen aquí</span>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div id="status">Cargando modelo...</div>

    <div class="result" id="resultContainer">
      <canvas id="canvas"></canvas>
      <br />
      <a id="downloadBtn" class="btn" download="sin_fondo.png">Descargar PNG</a>
    </div>
  </div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.19';

    const status = document.getElementById('status');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const resultContainer = document.getElementById('resultContainer');
    const canvas = document.getElementById('canvas');
    const downloadBtn = document.getElementById('downloadBtn');

    let pipe = null;

    async function init() {
      try {
        pipe = await pipeline('image-segmentation', 'Xenova/modnet');
        status.innerText = 'Listo. Selecciona una imagen.';
      } catch (e) {
        status.innerText = 'Error al cargar el modelo.';
      }
    }
    init();

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => process(e.target.files[0]));
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) process(e.dataTransfer.files[0]);
    });

    async function process(file) {
      if (!file || !pipe) return;

      status.innerText = 'Procesando...';
      resultContainer.style.display = 'none';

      const url = URL.createObjectURL(file);
      const output = await pipe(url);
      const mask = output[0].mask;

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, img.width, img.height);
        for (let i = 0; i < mask.data.length; i++) {
          imgData.data[i * 4 + 3] = mask.data[i];
        }
        ctx.putImageData(imgData, 0, 0);

        downloadBtn.href = canvas.toDataURL('image/png');
        status.innerText = 'Completado.';
        resultContainer.style.display = 'block';
      };
      img.src = url;
    }
  </script>
</body>
</html>
