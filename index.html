<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminador de Fondo</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; text-align: center; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .dropzone { border: 2px dashed #38bdf8; border-radius: 8px; padding: 40px 20px; cursor: pointer; background: rgba(56, 189, 248, 0.02); transition: all 0.2s ease; }
    .dropzone:hover { background: rgba(56, 189, 248, 0.08); }
    input[type="file"] { display: none; }
    #status { margin-top: 15px; font-size: 0.9em; color: #94a3b8; font-weight: 500; }
    .result { display: none; margin-top: 20px; }
    img { max-width: 100%; border-radius: 8px; background-image: linear-gradient(45deg, #334155 25%, transparent 25%), linear-gradient(-45deg, #334155 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #334155 75%), linear-gradient(-45deg, transparent 75%, #334155 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; text-decoration: none; display: inline-block; }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Eliminador de Fondo</h2>
    <div class="dropzone" id="dropzone">
      <span id="label">Haz clic o arrastra tu imagen aquí</span>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div id="status">Selecciona una imagen para comenzar.</div>

    <div class="result" id="resultContainer">
      <img id="outputImg" alt="Sin fondo" />
      <a id="downloadBtn" class="btn" download="imagen_sin_fondo.png">Descargar PNG Transparente</a>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const outputImg = document.getElementById('outputImg');
    const downloadBtn = document.getElementById('downloadBtn');

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => processImage(e.target.files[0]));
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) processImage(e.dataTransfer.files[0]);
    });

    async function processImage(file) {
      if (!file) return;

      status.innerText = "Procesando imagen con IA...";
      status.style.color = "#f59e0b";
      resultContainer.style.display = "none";

      const formData = new FormData();
      formData.append('image_file', file);

      // Intento 1: Servidor API Ultra Rápido (Clipdrop / RMBG Engine)
      try {
        const response = await fetch('https://clipdrop-api.co/remove-background/v1', {
          method: 'POST',
          headers: {
            'x-api-key': 'd1b28741364a3a6bd430335028059e6631b67f1396a987d6e6bd0c2ef38f12cb8f343a4291888b50e3bbd9082ef58893'
          },
          body: formData,
        });

        if (response.ok) {
          const blob = await response.blob();
          showResult(blob);
          return;
        }
      } catch (e) {
        console.warn("Fallo servicio 1, intentando endpoint alternativo...", e);
      }

      // Intento 2: Fallback Servidor HF API directa
      try {
        const responseHF = await fetch('https://birefnet-birefnet.hf.space/api/predict', {
          method: 'POST',
          body: JSON.stringify({ data: [await fileToDataURL(file)] }),
          headers: { 'Content-Type': 'application/json' }
        });
        
        const data = await responseHF.json();
        if (data && data.data && data.data[0]) {
          outputImg.src = data.data[0];
          downloadBtn.href = data.data[0];
          status.innerText = "¡Fondo eliminado con éxito!";
          status.style.color = "#10b981";
          resultContainer.style.display = "block";
          return;
        }
      } catch (err) {
        console.error("Error en fallback:", err);
      }

      status.innerText = "Error al procesar la imagen. Inténtalo de nuevo.";
      status.style.color = "#ef4444";
    }

    function showResult(blob) {
      const url = URL.createObjectURL(blob);
      outputImg.src = url;
      downloadBtn.href = url;
      status.innerText = "¡Fondo eliminado con éxito!";
      status.style.color = "#10b981";
      resultContainer.style.display = "block";
    }

    function fileToDataURL(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
