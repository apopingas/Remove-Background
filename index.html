<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminador de Fondo Gratis</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; text-align: center; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .dropzone { border: 2px dashed #38bdf8; border-radius: 8px; padding: 40px 20px; cursor: pointer; background: rgba(56, 189, 248, 0.02); transition: all 0.2s ease; }
    .dropzone:hover { background: rgba(56, 189, 248, 0.08); }
    input[type="file"] { display: none; }
    #status { margin-top: 15px; font-size: 0.9em; color: #94a3b8; font-weight: 500; }
    .result { display: none; margin-top: 20px; }
    canvas { max-width: 100%; border-radius: 8px; background-image: linear-gradient(45deg, #334155 25%, transparent 25%), linear-gradient(-45deg, #334155 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #334155 75%), linear-gradient(-45deg, transparent 75%, #334155 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; text-decoration: none; display: inline-block; }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Eliminador de Fondo</h2>
    <div class="dropzone" id="dropzone">
      <span id="label">Haz clic o arrastra tu imagen aquí</span>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div id="status">Cargando motor de IA... (Espera unos segundos)</div>

    <div class="result" id="resultContainer">
      <canvas id="outputCanvas"></canvas>
      <a id="downloadBtn" class="btn" download="sin_fondo.png">Descargar PNG Transparente</a>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';

    // Desactivar búsqueda de modelos locales para evitar fallos CORS
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const outputCanvas = document.getElementById('outputCanvas');
    const downloadBtn = document.getElementById('downloadBtn');

    let segmenter = null;

    // Inicializar el modelo
    async function init() {
      try {
        status.innerText = "Cargando modelo de IA (RMBG)...";
        segmenter = await pipeline('image-segmentation', 'Xenova/birefnet-general', {
          quantized: true,
        });
        status.innerText = "¡IA Lista! Selecciona una imagen.";
        status.style.color = "#10b981";
      } catch (e) {
        console.warn("Fallo al cargar BiRefNet, intentando modelo liviano secundario...", e);
        try {
          segmenter = await pipeline('image-segmentation', 'Xenova/rmbg-1.4');
          status.innerText = "¡IA Lista! Selecciona una imagen.";
          status.style.color = "#10b981";
        } catch (err2) {
          console.error("Error crítico:", err2);
          status.innerText = "Error al cargar la IA. Revisa tu conexión a internet.";
          status.style.color = "#ef4444";
        }
      }
    }

    init();

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => processImage(e.target.files[0]));
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) processImage(e.dataTransfer.files[0]);
    });

    async function processImage(file) {
      if (!file) return;
      if (!segmenter) {
        alert("La IA aún se está cargando, espera unos segundos por favor.");
        return;
      }

      status.innerText = "Procesando imagen...";
      status.style.color = "#f59e0b";
      resultContainer.style.display = "none";

      try {
        const imgUrl = URL.createObjectURL(file);
        
        // Ejecutar segmentación de fondo
        const output = await segmenter(imgUrl);
        const mask = output[0].mask;

        const img = new Image();
        img.onload = () => {
          outputCanvas.width = img.width;
          outputCanvas.height = img.height;
          const ctx = outputCanvas.getContext('2d');
          
          // Dibujar la imagen original
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, img.width, img.height);
          
          // Aplicar la máscara de transparencia
          for (let i = 0; i < mask.data.length; i++) {
            imgData.data[i * 4 + 3] = mask.data[i];
          }
          
          ctx.putImageData(imgData, 0, 0);

          const finalDataUrl = outputCanvas.toDataURL('image/png');
          downloadBtn.href = finalDataUrl;

          status.innerText = "¡Fondo eliminado correctamente!";
          status.style.color = "#10b981";
          resultContainer.style.display = "block";
        };
        img.src = imgUrl;

      } catch (error) {
        console.error("Error al procesar:", error);
        status.innerText = "Error al procesar la imagen.";
        status.style.color = "#ef4444";
      }
    }
  </script>
</body>
</html>
