<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminador de Fondo Gratis</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; text-align: center; margin-top: 40px; }
    .dropzone { border: 2px dashed #444; border-radius: 12px; padding: 40px 20px; cursor: pointer; background: #1e1e1e; transition: 0.2s; }
    .dropzone:hover { border-color: #0066cc; background: #252525; }
    input[type="file"] { display: none; }
    #status { margin: 20px 0; font-size: 15px; color: #4caf50; font-weight: 500; }
    .result { display: none; margin-top: 20px; }
    img.output { max-width: 100%; border-radius: 8px; background: repeating-conic-gradient(#808080 0% 25%, #fff 0% 50%) 50% / 16px 16px; }
    .btn { display: inline-block; background: #0066cc; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 15px; cursor: pointer; width: 100%; }
    .btn:hover { background: #0052a3; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.js"></script>
</head>
<body>

  <div class="container">
    <h2>Quitar Fondo Gratis</h2>
    
    <div class="dropzone" id="dropzone">
      <span id="label">Haz clic o arrastra tu imagen aquí</span>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div id="status">Sistema listo. Selecciona una imagen.</div>

    <div class="result" id="resultContainer">
      <img id="outputImg" class="output" alt="Resultado" />
      <br />
      <a id="downloadBtn" class="btn" download="sin_fondo.png">Descargar PNG Transparente</a>
    </div>
  </div>

  <script>
    const status = document.getElementById('status');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const resultContainer = document.getElementById('resultContainer');
    const outputImg = document.getElementById('outputImg');
    const downloadBtn = document.getElementById('downloadBtn');

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => process(e.target.files[0]));
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) process(e.dataTransfer.files[0]);
    });

    async function process(file) {
      if (!file) return;

      status.innerText = 'Procesando imagen (esto toma unos segundos)...';
      status.style.color = '#ff9800';
      resultContainer.style.display = 'none';

      try {
        // Remoción de fondo usando @imgly/background-removal
        const blob = await imglyRemoveBackground(file);
        const url = URL.createObjectURL(blob);

        outputImg.src = url;
        downloadBtn.href = url;

        status.innerText = '¡Fondo eliminado con éxito!';
        status.style.color = '#4caf50';
        resultContainer.style.display = 'block';
      } catch (error) {
        console.error(error);
        status.innerText = 'Error al procesar la imagen. Intenta con otra foto.';
        status.style.color = '#f44336';
      }
    }
  </script>
</body>
</html>
