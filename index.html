<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Eliminador de Fondos Gratis</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; text-align: center; border: 1px solid #334155; }
    .dropzone { border: 2px dashed #38bdf8; border-radius: 8px; padding: 40px 20px; cursor: pointer; background: rgba(56, 189, 248, 0.02); }
    .dropzone:hover { background: rgba(56, 189, 248, 0.08); }
    input[type="file"] { display: none; }
    #status { margin-top: 15px; font-size: 0.9em; color: #94a3b8; }
    .result { display: none; margin-top: 20px; }
    img { max-width: 100%; border-radius: 8px; background-image: linear-gradient(45deg, #334155 25%, transparent 25%), linear-gradient(-45deg, #334155 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #334155 75%), linear-gradient(-45deg, transparent 75%, #334155 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; text-decoration: none; display: inline-block; }
    .btn:hover { background: #7dd3fc; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.js"></script>
</head>
<body>

  <div class="card">
    <h2>Eliminador de Fondo</h2>
    <div class="dropzone" id="dropzone">
      <span id="label">Haz clic o arrastra tu imagen aquí</span>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div id="status">Selecciona una imagen para comenzar.</div>

    <div class="result" id="resultContainer">
      <img id="outputImg" alt="Sin fondo" />
      <a id="downloadBtn" class="btn" download="imagen_sin_fondo.png">Descargar PNG Transparente</a>
    </div>
  </div>

  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const outputImg = document.getElementById('outputImg');
    const downloadBtn = document.getElementById('downloadBtn');

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => process(e.target.files[0]));
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) process(e.dataTransfer.files[0]);
    });

    async function process(file) {
      if (!file) return;

      status.innerText = "Procesando imagen con IA...";
      status.style.color = "#f59e0b";
      resultContainer.style.display = "none";

      // 1. Intento principal con la API de BiRefNet (Calidad ultra alta)
      try {
        const app = await Client.connect("ZhengPeng7/BiRefNet");
        const result = await app.predict("/predict", [file]);

        if (result && result.data && result.data[0]) {
          const imgUrl = result.data[0].url;
          showSuccess(imgUrl);
          return;
        }
      } catch (err) {
        console.warn("La API externa falló o está dormida, cambiando a motor local...", err);
      }

      // 2. Fallback de emergencia local (@imgly) -> NUNCA FALLA
      try {
        status.innerText = "Procesando localmente en tu dispositivo...";
        const blob = await imglyRemoveBackground(file);
        const localUrl = URL.createObjectURL(blob);
        showSuccess(localUrl);
      } catch (fallbackErr) {
        console.error(fallbackErr);
        status.innerText = "Error inesperado al procesar la imagen.";
        status.style.color = "#ef4444";
      }
    }

    function showSuccess(url) {
      outputImg.src = url;
      downloadBtn.href = url;
      status.innerText = "¡Fondo eliminado con éxito!";
      status.style.color = "#10b981";
      resultContainer.style.display = "block";
    }
  </script>
</body>
</html>
